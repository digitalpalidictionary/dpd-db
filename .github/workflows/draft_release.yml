name: Draft Release

on:
 workflow_dispatch:
  inputs:
    push_submodules:
      description: "Run exporters and push to fdg_dpd, bw2, sc-data, tpr_downloads (uposatha days only)"
      type: boolean
      required: false
      default: false
    push_dry_run:
      description: "With push_submodules: run on any day and use git push --dry-run"
      type: boolean
      required: false
      default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      RELEASE_DATE: ${{ steps.set_release_date.outputs.RELEASE_DATE }}
      RELEASE_TAG: ${{ steps.set_release_tag.outputs.RELEASE_TAG }}
      SUBMODULES_RUN: ${{ steps.submodule_gate.outputs.run }}

    steps:

    # ----------------------------------------
    # Setup
    # ----------------------------------------

    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        repository: 'digitalpalidictionary/dpd-db'
        ref: 'main'
        submodules: 'recursive'
        # Fetch depth 1 for shallow clone to save disk space
        fetch-depth: 1
        # Use PAT to allow pushing to the submodule
        token: ${{ secrets.GH_PAT }}

    - name: Remove large dirs
      run: |
        rm -rf ${{ github.workspace }}/resources/bjt/dev/*
        rm -rf ${{ github.workspace }}/resources/sc-data/html_text/*

    - name: Install dictzip
      run: sudo apt-get update && sudo apt-get install -y dictzip

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install Slob Linux dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential libicu-dev icu-devtools pkg-config
     
    - name: Install dependencies
      run: uv sync --all-groups

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.22.2'

    # ----------------------------------------
    # Submodule updates (optional, see push_submodules input)
    # ----------------------------------------

    - name: Check submodule gate
      id: submodule_gate
      if: inputs.push_submodules == true
      # an empty output skips every later submodule step; the release is unaffected
      continue-on-error: true
      run: |
        if [ "${{ inputs.push_dry_run }}" = "true" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          # the tool's exit code cannot tell a crash from "not an uposatha" (both 1),
          # so read the printed answer instead
          answer=$(uv run python -c "from tools.uposatha_day import UposathaManger; print(UposathaManger.uposatha_today())" | tail -n 1) || answer="crashed"
          if [ "$answer" = "True" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$answer" = "False" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not an uposatha day, skipping submodule updates"
          else
            echo "::error::uposatha check gave '$answer', submodule updates skipped"
            exit 1
          fi
        fi

    # Must run before the exporters: they write into these submodules.
    # No reset --hard: it would restore the sc-data html_text files deleted above.
    - name: Sync submodules with upstream
      id: sync_submodules
      if: steps.submodule_gate.outputs.run == 'true'
      # a failure here must never stop the release build; the push step reads this outcome
      continue-on-error: true
      shell: bash
      run: |
        for entry in resources/fdg_dpd:main resources/bw2:main resources/sc-data:main resources/tpr_downloads:master; do
          path="${entry%%:*}"
          branch="${entry##*:}"
          echo "Syncing $path to origin/$branch"
          git -C "$path" fetch --depth 1 origin "$branch"
          git -C "$path" checkout -B "$branch" "origin/$branch"
        done

    # ----------------------------------------
    # Build Database
    # ----------------------------------------

    - name: Config for GitHub release
      run: uv run python scripts/build/config_github_release.py

    - name: Create dpd.db
      run: touch dpd.db

    - name: Build the database
      run: uv run python scripts/build/db_rebuild_from_tsv.py

    - name: Run initial setup script
      run: uv run python scripts/bash/initial_setup_run_once.py
    
    - name: Create version
      run: uv run python tools/version.py

    - name: Create Inflection Templates
      run: uv run python db/inflections/create_inflection_templates.py

    - name: Create Inflection Tables
      run: uv run python db/inflections/generate_inflection_tables.py

    - name: Update Root Has Verb values
      run: uv run python scripts/build/root_has_verb_updater.py

    - name: Update Sanskrit Family Roots
      run: uv run python scripts/build/sanskrit_root_families_updater.py

    - name: Add Root Families
      run: uv run python db/families/family_root.py

    - name: Add Word Families
      run: uv run python db/families/family_word.py
    
    - name: Add Compound Families
      run: uv run python db/families/family_compound.py

    - name: Add Sets
      run: uv run python db/families/family_set.py

    - name: Add Idioms
      run: uv run python db/families/family_idiom.py

    - name: Families to JSON
      run: uv run python scripts/build/families_to_json.py

    - name: Extract Variants
      run: uv run python db/variants/main.py

    - name: Generate Deconstructor
      run: go run go_modules/deconstructor/main.go

    - name: Add Deconstructor to db
      run: uv run python scripts/build/deconstructor_output_add_to_db.py
        
    - name: Add api ca eva iti to inflections 
      run: uv run python scripts/build/api_ca_eva_iti_iva_hi.py

    - name: Transliterate Inflections
      run: uv run python db/inflections/transliterate_inflections.py

    - name: Inflections to Headwords
      run: uv run python db/inflections/inflections_to_headwords.py

    - name: Populate Sutta table
      run: uv run python db/suttas/suttas_update.py

    - name: Add Suttas to Lookup table
      run: uv run python db/suttas/suttas_to_lookup.py

    - name: Generate Grammar data
      run: uv run python db/grammar/grammar_to_lookup.py

    - name: Lookup Variants and Spelling Mistakes 
      run: uv run python db/lookup/spelling_mistakes.py

    - name: Lookup Transliterate
      run: uv run python db/lookup/transliterate_lookup_table.py

    - name: Lookup Help and Abbreviations
      run: uv run python db/lookup/help_abbrev_add_to_lookup.py

    - name: Add Frequency
      run: |
        go build -o frequency go_modules/frequency/main.go
        ./frequency

    - name: Run EBT Counter
      run: uv run python scripts/build/ebt_counter.py

    - name: Update Bold Definitions
      run: uv run python db/bold_definitions/update_bold_definitions_db.py

    - name: Add EPD to Lookup Table
      run: uv run python db/epd/epd_to_lookup.py
      
    - name: Test Dealbreakers
      run: uv run python scripts/build/dealbreakers.py

    # ----------------------------------------
    # Download Audio Database
    # ----------------------------------------

    - name: Download Audio Index
      run: uv run python audio/index_release_download.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ----------------------------------------
    # Exporter
    # ----------------------------------------

    - name: Setup disk space checker
      run: |
        cat << 'EOF' >> $HOME/check_disk.sh
        #!/bin/bash
        echo "=== Disk space and large files (>1GB) ==="
        df -h
        du -h --max-depth=2 ${{ github.workspace }} | grep -E "^[0-9.]+[GT]" || echo "No files >1GB found"
        EOF
        chmod +x $HOME/check_disk.sh
           
    - name: Export Grammar Dictionary
      run: uv run python exporter/grammar_dict/grammar_dict.py
    
    - name: Export GoldenDict & MDict
      run: |
        uv run python exporter/goldendict/main.py
        echo "=== After GoldenDict export ==="
        $HOME/check_disk.sh

    - name: Export Deconstructor
      run: |
        uv run python exporter/deconstructor/deconstructor_exporter.py
        echo "=== After Deconstructor export ==="
        $HOME/check_disk.sh

    # kindling replaces the retired kindlegen. Downloading the pinned release
    # asset takes ~0.6s on a runner; `cargo install` takes ~200s (measured, run
    # 34754250894), so the binary is fetched rather than built or committed.
    - name: Install kindling
      env:
        KINDLING_VERSION: "0.45.6"
        KINDLING_SHA256: "417ad6dad4b1072fabb20610f320ba44ca8f4afcbe2f47948dcefc3955bd6439"
      run: |
        curl -sSfL -o exporter/kindle/kindling-cli \
          "https://github.com/ciscoriordan/kindling/releases/download/v${KINDLING_VERSION}/kindling-cli-linux"
        echo "${KINDLING_SHA256}  exporter/kindle/kindling-cli" | sha256sum -c -
        chmod +x exporter/kindle/kindling-cli
        exporter/kindle/kindling-cli --version

    - name: Export Kindle & ePub
      run: |
        uv run python exporter/kindle/kindle_exporter.py
        echo "=== After Kindle export ==="
        $HOME/check_disk.sh

    - name: Export Kobo
      run: |
        uv run python exporter/kobo/kobo.py
        echo "=== After Kobo export ==="
        $HOME/check_disk.sh

    - name: Export Variants
      run: |
        uv run python exporter/variants/variants_exporter.py
        echo "=== After Variants export ==="
        $HOME/check_disk.sh

    - name: Export TXT
      run: |
        uv run python exporter/txt/export_txt.py
        echo "=== After TXT export ==="
        $HOME/check_disk.sh

    - name: Install Typst CLI
      run: |
        curl -sSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz | tar xJ
        sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
        typst --version

    - name: Export PDF
      run: |
        uv run python exporter/pdf/pdf_exporter.py
        echo "=== After PDF export ==="
        $HOME/check_disk.sh

    - name: Prepare dictionary sources
      working-directory: resources/other-dictionaries
      run: uv run python scripts/prepare_sources.py

    - name: Export Mobile DB
      run: |
        uv run python exporter/mobile/mobile_exporter.py
        echo "=== After Mobile DB export ==="
        $HOME/check_disk.sh

    - name: Export Anki Deck
      run: |
        uv run exporter/anki/anki_apkg_exporter.py
        echo "=== After Anki export ==="
        $HOME/check_disk.sh

    # ----------------------------------------
    # Export Apple Dictionary Source
    # ----------------------------------------

    - name: Export Apple Dictionary
      run: |
        uv run python exporter/apple_dictionary/apple_dictionary.py
        echo "=== After Apple Dictionary export ==="
        ls -lh exporter/share/apple_dictionary/
        $HOME/check_disk.sh

    # ----------------------------------------
    # Export to submodules
    # ----------------------------------------

    # continue-on-error on these steps and the push step: a submodule problem
    # must not fail the job, because the macOS and release jobs wait for it.
    - name: Run TBW Exporter
      id: tbw
      if: steps.submodule_gate.outputs.run == 'true' && steps.sync_submodules.outcome == 'success'
      continue-on-error: true
      run: uv run python exporter/tbw/tbw_exporter.py

    - name: Run SuttaCentral Exporter
      id: sc
      if: steps.submodule_gate.outputs.run == 'true' && steps.sync_submodules.outcome == 'success'
      continue-on-error: true
      run: uv run python exporter/sutta_central/sutta_central_exporter.py

    - name: Run TPR Exporter
      id: tpr
      if: steps.submodule_gate.outputs.run == 'true' && steps.sync_submodules.outcome == 'success'
      continue-on-error: true
      run: uv run python exporter/tpr/tpr_exporter.py

    # Pack each submodule's changed files for the push-submodules job, which runs
    # after the release exists. Deletions cannot be carried in a tarball, so a leg
    # that staged one is refused.
    - name: Collect submodule output
      id: collect_submodules
      if: steps.submodule_gate.outputs.run == 'true'
      continue-on-error: true
      shell: bash
      env:
        SYNC_OUTCOME: ${{ steps.sync_submodules.outcome }}
        OUT_TBW: ${{ steps.tbw.outcome }}
        OUT_SC: ${{ steps.sc.outcome }}
        OUT_TPR: ${{ steps.tpr.outcome }}
      run: |
        mkdir -p "$GITHUB_WORKSPACE/submodule-out"
        # lets the push job tell "nothing to push" from "artifact missing"
        echo "collect step started" > "$GITHUB_WORKSPACE/submodule-out/collect_done.txt"

        # Every command returns 1 on failure. set -e is switched off inside a
        # function called as "(f) || ...", so it cannot be relied on here.
        collect_one() {
          local path=$1 stage=$2 staged
          cd "$GITHUB_WORKSPACE/$path" || return 1
          git add -- "$stage" || return 1
          # captured first: grep -q exiting early would trip pipefail on a pipe
          staged=$(git diff --cached --name-status) || return 1
          echo "Staged changes:"
          echo "$staged"
          if grep -q '^D' <<< "$staged"; then
            echo "::error::$path staged a deletion, which the push job cannot carry"
            return 1
          fi
          if git diff --cached --quiet; then
            echo "Nothing staged"
            return 0
          fi
          git diff --cached --name-only -z | tar -czf "$GITHUB_WORKSPACE/submodule-out/$(basename "$path").tar.gz" --null -T - || return 1
        }

        # path:stage-path:exporter-outcome-variable. sc-data stages one file only: the
        # Remove large dirs step deleted its html_text files, and "git add ." would
        # collect those deletions.
        failed=0
        for entry in \
          "resources/fdg_dpd:.:OUT_TBW" \
          "resources/bw2:.:OUT_TBW" \
          "resources/sc-data:dictionaries/simple/en/pli2en_dpd.json:OUT_SC" \
          "resources/tpr_downloads:.:OUT_TPR"; do
          IFS=: read -r path stage outcome_var <<< "$entry"
          echo "=== $path ==="
          if [ "$SYNC_OUTCOME" != "success" ] || [ "${!outcome_var}" != "success" ]; then
            echo "::warning::$path not collected: sync was '$SYNC_OUTCOME', exporter was '${!outcome_var}'"
            failed=1
            continue
          fi
          (collect_one "$path" "$stage") || { echo "::error::$path failed"; failed=1; }
        done
        exit $failed

    - name: Upload submodule output
      if: steps.submodule_gate.outputs.run == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: submodule-output
        path: submodule-out/
        if-no-files-found: ignore
        retention-days: 1

    # ----------------------------------------
    # Package Assets
    # ----------------------------------------

    - name: Zip GoldenDict & Mdict
      run: |
        uv run python scripts/build/zip_goldendict_mdict.py
        echo "=== After zipping ==="
        $HOME/check_disk.sh

    - name: Tarball DB
      run: |
        uv run python scripts/build/tarball_db.py
        echo "=== After tarball ==="
        $HOME/check_disk.sh

    # ----------------------------------------
    # Upload Artifacts for macOS Build
    # ----------------------------------------

    - name: Upload Apple Dictionary Source
      uses: actions/upload-artifact@v7
      with:
        name: apple-dictionary-source
        path: exporter/share/apple_dictionary/
        retention-days: 1

    # ----------------------------------------
    # Prepare Release Metadata
    # ----------------------------------------

    - name: Make Release Notes
      run: uv run python tools/docs_changelog_and_release_notes.py

    - name: Commit updated uposatha count
      run: |
        if git diff --quiet tools/uposatha_day.ini; then
          echo "No changes to uposatha count"
        else
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/uposatha_day.ini
          git commit -m "chore: update uposatha count"
          git push
        fi

    - name: Set Release Date
      id: set_release_date
      run: |
        echo "RELEASE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
        echo "RELEASE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Set Release Tag
      id: set_release_tag
      run: |
        echo "RELEASE_TAG=$(uv run python scripts/build/version_print.py)" >> $GITHUB_ENV
        echo "RELEASE_TAG=$(uv run python scripts/build/version_print.py)" >> $GITHUB_OUTPUT

    - name: Prepare Kobo Asset
      run: cp exporter/share/dicthtml-pi-en.zip exporter/share/dpd-kobo.zip

    # ----------------------------------------
    # Upload Linux Artifacts
    # ----------------------------------------

    - name: Check all release assets exist
      run: |
        for f in dpd-goldendict.zip dpd-slob.zip dpd-mdict.zip dpd-kindle.epub \
                 dpd-kindle.mobi dpd.db.tar.xz dpd-kobo.zip dpd-txt.zip \
                 dpd-mobile-db.zip dpd-anki.apkg dpd-pdf.zip release_notes.md; do
          if [ ! -f "exporter/share/$f" ]; then
            echo "::warning::missing release asset: $f"
          fi
        done

    - name: Upload Linux Assets
      uses: actions/upload-artifact@v7
      with:
        name: linux-assets
        path: |
          exporter/share/dpd-goldendict.zip
          exporter/share/dpd-slob.zip
          exporter/share/dpd-mdict.zip
          exporter/share/dpd-kindle.epub
          exporter/share/dpd-kindle.mobi
          exporter/share/dpd.db.tar.xz
          exporter/share/dpd-kobo.zip
          exporter/share/dpd-txt.zip
          exporter/share/dpd-mobile-db.zip
          exporter/share/dpd-anki.apkg
          exporter/share/dpd-pdf.zip
          exporter/share/release_notes.md
        retention-days: 1

  # ----------------------------------------
  # Job 2: Build Apple Dictionary
  # ----------------------------------------

  build-macos:
    needs: build-linux
    runs-on: macos-latest

    steps:
      - name: Download Apple Dictionary Source
        uses: actions/download-artifact@v8
        with:
          name: apple-dictionary-source
          path: ./apple-dictionary-source/

      - name: Setup Dictionary Development Kit
        run: |
          # Install Rosetta 2 for legacy binary compatibility
          if ! /usr/bin/pgrep oahd >/dev/null 2>&1; then
              sudo softwareupdate --install-rosetta --agree-to-license
          fi
          
          git clone --depth 1 https://github.com/SebastianSzturo/Dictionary-Development-Kit.git
          
          DDK_PATH="$(pwd)/Dictionary-Development-Kit"
          echo "DDK_PATH=$DDK_PATH" >> $GITHUB_ENV
          
          # Ensure binaries are executable
          chmod +x "$DDK_PATH/bin/"*

      - name: Build Dictionary
        run: |
          if [ ! -s "./apple-dictionary-source/Dictionary.xml" ]; then
            echo "Error: Dictionary.xml is missing or empty"
            exit 1
          fi
          
          mkdir -p build
          cp ./apple-dictionary-source/Dictionary.xml ./build/
          cp ./apple-dictionary-source/Dictionary.css ./build/
          cp ./apple-dictionary-source/Info.plist ./build/
          
          cd build
          
          # Compile using Rosetta 2 (arch -x86_64)
          arch -x86_64 "$DDK_PATH/bin/build_dict.sh" \
            "Digital-Pali-Dictionary" \
            Dictionary.xml \
            Dictionary.css \
            Info.plist
            
          # Move output from objects directory to root for packaging
          if [ -d "objects/Digital-Pali-Dictionary.dictionary" ]; then
            mv objects/Digital-Pali-Dictionary.dictionary .
          else
            echo "Error: Build failed to produce .dictionary bundle"
            exit 1
          fi

      - name: Package Dictionary
        run: |
          cd build
          zip -r dpd-apple.dictionary.zip Digital-Pali-Dictionary.dictionary

      - name: Upload Apple Dictionary
        uses: actions/upload-artifact@v7
        with:
          name: macos-dictionary
          path: build/dpd-apple.dictionary.zip
          retention-days: 1

  # ----------------------------------------
  # Job 3: Create Draft Release
  # ----------------------------------------

  create-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux Assets
        uses: actions/download-artifact@v8
        with:
          name: linux-assets
          path: ./linux-assets/

      - name: Download Apple Dictionary
        uses: actions/download-artifact@v8
        with:
          name: macos-dictionary
          path: ./macos-dictionary/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-linux.outputs.RELEASE_TAG }}
          name: ${{ needs.build-linux.outputs.RELEASE_DATE }}
          body_path: ./linux-assets/release_notes.md
          draft: true
          prerelease: false
          files: |
            ./linux-assets/dpd-goldendict.zip
            ./linux-assets/dpd-slob.zip
            ./linux-assets/dpd-mdict.zip
            ./linux-assets/dpd-kindle.epub
            ./linux-assets/dpd-kindle.mobi
            ./linux-assets/dpd.db.tar.xz
            ./linux-assets/dpd-kobo.zip
            ./linux-assets/dpd-txt.zip
            ./linux-assets/dpd-mobile-db.zip
            ./linux-assets/dpd-anki.apkg
            ./linux-assets/dpd-pdf.zip
            ./macos-dictionary/dpd-apple.dictionary.zip
          # the token input beats the GITHUB_TOKEN env var, so the PAT must go here to make bdhrs the release author
          token: ${{ secrets.GH_PAT }}

  # ----------------------------------------
  # Job 4: Push submodules (only after the release exists)
  # ----------------------------------------

  push-submodules:
    needs: [build-linux, create-release]
    if: needs.build-linux.outputs.SUBMODULES_RUN == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: 'digitalpalidictionary/dpd-db'
          ref: 'main'
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Download submodule output
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: submodule-output
          path: ./submodule-out/

      # continue-on-error: the release already exists, a failure here must not
      # turn the whole run red. Each leg reports its own ::error::.
      - name: Push submodules
        continue-on-error: true
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/submodule-out/collect_done.txt" ]; then
            echo "::error::submodule-output artifact is missing, nothing was pushed"
            exit 1
          fi

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # same header actions/checkout uses; the base64 form is not auto-masked
          b64=$(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)
          echo "::add-mask::$b64"
          auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $b64")

          dry_run=""
          if [ "${{ inputs.push_dry_run }}" = "true" ]; then
            dry_run="--dry-run"
          fi

          # Every command returns 1 on failure. set -e is switched off inside a
          # function called as "(f) || ...", so it cannot be relied on here.
          push_one() {
            local path=$1 branch=$2 name tarball url
            name=$(basename "$path")
            tarball="$GITHUB_WORKSPACE/submodule-out/$name.tar.gz"
            echo "=== $path ($branch) ==="
            if [ ! -f "$tarball" ]; then
              echo "No output collected for $name, nothing to push"
              return 0
            fi
            url=$(git config -f "$GITHUB_WORKSPACE/.gitmodules" --get "submodule.$path.url") || return 1
            rm -rf "${GITHUB_WORKSPACE:?}/$path"
            git "${auth[@]}" clone --depth 1 --branch "$branch" --no-checkout "$url" "$GITHUB_WORKSPACE/$path" || return 1
            cd "$GITHUB_WORKSPACE/$path" || return 1
            # sc-data tracks about 70k html_text files that this job never touches
            if [ "$path" = "resources/sc-data" ]; then
              git sparse-checkout set --no-cone '/*' '!/html_text/' || return 1
            fi
            git checkout "$branch" || return 1
            tar -xzf "$tarball" || return 1
            git add -- . || return 1
            echo "Staged changes:"
            git diff --cached --name-status || return 1
            if git diff --cached --quiet; then
              echo "Nothing changed upstream-side, skipping push"
              return 0
            fi
            git commit -m "DPD lookup: update $(date +'%d-%b-%y')" || return 1
            git "${auth[@]}" push $dry_run origin "$branch:$branch" || return 1
          }

          failed=0
          for entry in \
            "resources/fdg_dpd:main" \
            "resources/bw2:main" \
            "resources/sc-data:main" \
            "resources/tpr_downloads:master"; do
            IFS=: read -r path branch <<< "$entry"
            (push_one "$path" "$branch") || { echo "::error::$path failed"; failed=1; }
          done
          exit $failed
